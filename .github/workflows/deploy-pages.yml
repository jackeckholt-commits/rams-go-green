name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install website tools
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages files
        run: node scripts/build-github-pages.mjs
        env:
          GITHUB_PAGES: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
